[package]
name = "torn-platform-winit"
description = "Winit native-window adapter for Torn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
accesskit = "0.24"
accesskit_winit = { version = "0.32", default-features = false, features = ["rwh_06"] }
arboard = "3.6"
torn-core = { path = "../torn-core" }
torn-platform = { path = "../torn-platform" }
torn-wgpu = { path = "../torn-wgpu" }
winit = { version = "0.30.13", features = ["rwh_06"] }
