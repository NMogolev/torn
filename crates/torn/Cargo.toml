[package]
name = "torn"
description = "Public facade for the Torn UI toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Enables audio-mastered Paleo playback through the cpal output backend.
audio = ["torn-widgets/audio"]
# Enables the optional media director runtime.
director = ["dep:torn-director"]

[dependencies]
torn-browser = { path = "../torn-browser" }
torn-core = { path = "../torn-core" }
torn-director = { path = "../torn-director", optional = true }
torn-render = { path = "../torn-render" }
torn-software = { path = "../torn-software" }
torn-wgpu = { path = "../torn-wgpu" }
torn-platform = { path = "../torn-platform" }
torn-ui = { path = "../torn-ui" }
torn-widgets = { path = "../torn-widgets" }
torn-workspace = { path = "../torn-workspace" }

[dev-dependencies]
torn-platform-winit = { path = "../torn-platform-winit" }
