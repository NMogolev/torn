[package]
name = "drawen"
description = "Public facade for the Drawen UI toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = []
# Enables audio-mastered Paleo playback through the cpal output backend.
audio = ["drawen-widgets/audio"]
# Enables the optional media director runtime.
director = ["dep:drawen-director"]

[dependencies]
drawen-browser = { version = "0.1.0", path = "../drawen-browser" }
drawen-core = { version = "0.1.0", path = "../drawen-core" }
drawen-director = { version = "0.1.0", path = "../drawen-director", optional = true }
drawen-render = { version = "0.1.0", path = "../drawen-render" }
drawen-software = { version = "0.1.0", path = "../drawen-software" }
drawen-wgpu = { version = "0.1.0", path = "../drawen-wgpu" }
drawen-platform = { version = "0.1.0", path = "../drawen-platform" }
drawen-tasks = { version = "0.1.0", path = "../drawen-tasks" }
drawen-ui = { version = "0.1.0", path = "../drawen-ui" }
drawen-widgets = { version = "0.1.0", path = "../drawen-widgets" }
drawen-workspace = { version = "0.1.0", path = "../drawen-workspace" }

[dev-dependencies]
drawen-platform-winit = { version = "0.1.0", path = "../drawen-platform-winit" }
