[package]
name = "paleo-h264"
description = "Pure-Rust H.264 decoding backend for Paleo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
paleo = { version = "0.1.0", path = "../paleo" }
# Pin the decoder exactly: its streaming API is young and the packet bridge in
# this crate is written against this release.
rusty_h264-common = { version = "=0.17.2", default-features = false, features = [
    "std",
] }
rusty_h264-decoder = { version = "=0.17.2", default-features = false, features = [
    "std",
] }
