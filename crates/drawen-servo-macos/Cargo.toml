[package]
name = "drawen-servo-macos"
description = "macOS IOSurface shared-texture interop for Drawen browser embedding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", features = ["std"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-io-surface = "=0.3.2"
objc2-metal = { version = "=0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLDevice",
    "MTLEvent",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
    "objc2-io-surface",
] }
wgpu = "=29.0.4"

[target.'cfg(target_os = "macos")'.dev-dependencies]
pollster = "0.4.0"
