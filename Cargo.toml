[workspace]
members = [
    "crates/torn-core",
    "crates/torn-render",
    "crates/torn-ui",
    "crates/torn-widgets",
    "crates/torn-software",
    "crates/torn",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/NMogolev/torn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
