[workspace]
members = [
    "crates/paleo",
    "crates/paleo-audio",
    "crates/paleo-h264",
    "crates/drawen-core",
    "crates/drawen-render",
    "crates/drawen-ui",
    "crates/drawen-widgets",
    "crates/drawen-software",
    "crates/drawen-wgpu",
    "crates/drawen-platform",
    "crates/drawen-platform-winit",
    "crates/drawen-workspace",
    "crates/drawen-director",
    "crates/drawen-servo-windows",
    "crates/drawen-servo-linux",
    "crates/drawen-servo-macos",
    "crates/drawen-servo",
    "crates/drawen-browser",
    "crates/drawen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/NMogolev/drawen"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
